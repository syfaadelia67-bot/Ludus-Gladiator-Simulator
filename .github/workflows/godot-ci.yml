name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-project:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Godot version
        run: godot --version

      - name: Import project and validate scripts
        shell: bash
        run: |
          set +e
          godot --headless --editor --path game --quit-after 20 2>&1 | tee godot-import.log
          GODOT_STATUS=${PIPESTATUS[0]}
          PATTERN='Parse Error|Compile Error|Failed to load script|Failed to create an autoload'
          if grep -Ein "$PATTERN" godot-import.log; then
            echo '### Godot import errors' >> "$GITHUB_STEP_SUMMARY"
            grep -Ein "$PATTERN" godot-import.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Godot editor exited with status $GODOT_STATUS."
            tail -n 80 godot-import.log
            exit "$GODOT_STATUS"
          fi

      - name: Validate main scene startup
        shell: bash
        run: |
          set +e
          godot --headless --path game --quit-after 5 2>&1 | tee godot-startup.log
          GODOT_STATUS=${PIPESTATUS[0]}
          PATTERN="SCRIPT ERROR|Invalid call|Node not found|Can't use get_node|Failed to load script|Failed to create an autoload"
          if grep -Ein "$PATTERN" godot-startup.log; then
            echo '### Godot startup errors' >> "$GITHUB_STEP_SUMMARY"
            grep -Ein "$PATTERN" godot-startup.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Godot runtime exited with status $GODOT_STATUS."
            tail -n 80 godot-startup.log
            exit "$GODOT_STATUS"
          fi

      - name: Upload Godot validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-logs
          path: |
            godot-import.log
            godot-startup.log
          if-no-files-found: ignore
