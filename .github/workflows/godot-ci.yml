name: Godot CI

on:
  push:
    branches:
      - main
      - feature/demo-data-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.2

jobs:
  validate-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Show Godot version
        run: godot --version

      - name: Import project and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          set +e
          godot --headless --editor --path game --quit 2>&1 | tee godot-import.log
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          PATTERN='Parse Error|Compile Error|SCRIPT ERROR|Failed to load script|Failed to create an autoload'
          if grep -Ein "$PATTERN" godot-import.log; then
            echo '### Godot import errors' >> "$GITHUB_STEP_SUMMARY"
            grep -Ein "$PATTERN" godot-import.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Godot editor exited with status $GODOT_STATUS."
            tail -n 80 godot-import.log
            exit "$GODOT_STATUS"
          fi

      - name: Validate explicit main scene startup
        shell: bash
        run: |
          set -euo pipefail
          set +e
          godot --headless --path game res://scenes/Main.tscn --quit 2>&1 | tee godot-startup.log
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          PATTERN='Parse Error|Compile Error|SCRIPT ERROR|Invalid call|Node not found|Can.t use get_node|Failed to load script|Failed to create an autoload'
          if grep -Ein "$PATTERN" godot-startup.log; then
            echo '### Godot startup errors' >> "$GITHUB_STEP_SUMMARY"
            grep -Ein "$PATTERN" godot-startup.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Godot runtime exited with status $GODOT_STATUS."
            tail -n 80 godot-startup.log
            exit "$GODOT_STATUS"
          fi

      - name: Upload Godot validation logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: godot-validation-logs-${{ github.run_attempt }}
          path: |
            godot-import.log
            godot-startup.log
          if-no-files-found: ignore
          retention-days: 14
