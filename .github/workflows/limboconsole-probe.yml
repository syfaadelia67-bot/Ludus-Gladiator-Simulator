name: LimboConsole Compatibility Probe

on:
  pull_request:
    branches:
      - feature/demo-data-foundation
    paths:
      - .github/workflows/limboconsole-probe.yml
      - game/tools/run_limboconsole_probe.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: limboconsole-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.2

jobs:
  limboconsole-probe:
    name: LimboConsole 0.8 on Godot 4.5.2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Show Godot version
        run: godot --version

      - name: Run isolated LimboConsole probe
        run: bash game/tools/run_limboconsole_probe.sh

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: limboconsole-probe-${{ github.run_attempt }}
          path: game/test-results/limboconsole-probe.log
          if-no-files-found: warn
          retention-days: 14
