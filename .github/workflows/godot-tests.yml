name: Godot Tests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.2

jobs:
  compile:
    name: Compile and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Show Godot version
        run: godot --version

      - name: Import and compile project
        run: godot --headless --editor --path game --quit

      - name: Smoke test main scene
        run: godot --headless --path game res://scenes/Main.tscn --quit

  core-systems:
    name: Core systems suite
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Import resources
        run: godot --headless --editor --path game --quit

      - name: Run core systems suite
        run: godot --headless --path game -- --test=res://tests/... --test-group=core

  ui-contracts:
    name: UI and integration contracts
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Import resources
        run: godot --headless --editor --path game --quit

      - name: Run UI and integration suite
        run: godot --headless --path game -- --test=res://tests/... --test-group=ui
