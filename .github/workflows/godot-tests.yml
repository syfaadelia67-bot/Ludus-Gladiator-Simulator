name: Godot Tests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.2

jobs:
  compile:
    name: Compile and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Show Godot version
        run: godot --version

      - name: Import and compile project
        run: godot --headless --editor --path game --quit

      - name: Smoke test main scene
        run: godot --headless --path game res://scenes/Main.tscn --quit

  core-systems:
    name: Core systems suite
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Import resources
        run: godot --headless --editor --path game --quit

      - name: Run core systems suite
        run: bash game/tools/run_test_group.sh core

      - name: Upload core suite diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-test-results-${{ github.run_attempt }}
          path: |
            game/test-results/core-list.log
            game/test-results/core-suite.log
            game/test-results/core-tests/
          if-no-files-found: warn
          retention-days: 14

  ui-contracts:
    name: UI and integration contracts
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Import resources
        run: godot --headless --editor --path game --quit

      - name: Run UI and integration suite
        run: bash game/tools/run_test_group.sh ui

      - name: Upload UI suite diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-results-${{ github.run_attempt }}
          path: |
            game/test-results/ui-list.log
            game/test-results/ui-suite.log
            game/test-results/ui-tests/
          if-no-files-found: warn
          retention-days: 14

  gut-tests:
    name: GUT behavior tests
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Verify GUT runner dependencies
        run: |
          command -v curl
          command -v unzip
          command -v python3
          command -v timeout

      - name: Run GUT 9.5.0 behavior suite
        run: bash game/tools/run_gut.sh

      - name: Upload GUT reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gut-test-results-${{ github.run_attempt }}
          path: game/test-results/
          if-no-files-found: warn
          retention-days: 14
