name: LimboAI Integration Cleanup Once

on:
  push:
    branches:
      - feature/monthly-campaign-foundation
    paths:
      - .github/workflows/limboai-integration-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/monthly-campaign-foundation
          persist-credentials: true

      - name: Remove generated LimboAI icon import metadata
        shell: bash
        run: |
          set -euo pipefail
          find game/addons/limboai/icons -type f -name '*.svg.import' -delete
          if ! grep -qxF 'game/addons/limboai/icons/*.svg.import' .gitignore; then
            printf '\n# LimboAI icon import sidecars are regenerated by the active Godot editor.\ngame/addons/limboai/icons/*.svg.import\n' >> .gitignore
          fi

      - name: Apply pinned GDScript formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'gdtoolkit==4.5.0'
          gdformat game/scripts/combat/limboai_policy_adapter.gd game/tests/limboai_policy_adapter_contract_test.gd

      - name: Commit normalization
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No integration cleanup changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .gitignore game/addons/limboai/icons game/scripts/combat/limboai_policy_adapter.gd game/tests/limboai_policy_adapter_contract_test.gd
          git commit -m 'chore(ai): normalize LimboAI integration metadata'
          git push origin HEAD:feature/monthly-campaign-foundation
