name: GDScript Format Preview

on:
  pull_request:
    branches:
      - chore/ci-hardening

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Format changed GDScript and print patch
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 -m venv .ci-format-venv
          .ci-format-venv/bin/python -m pip install --disable-pip-version-check --no-input 'gdtoolkit==4.5.0'
          git diff --name-only -z --diff-filter=ACMR "$PR_BASE_SHA" "$PR_HEAD_SHA" -- '*.gd' > changed-gdscript.bin
          mapfile -d '' FILES < changed-gdscript.bin
          .ci-format-venv/bin/gdformat "${FILES[@]}"
          echo '===== GDFORMAT PATCH BEGIN ====='
          git diff -- "${FILES[@]}"
          echo '===== GDFORMAT PATCH END ====='
