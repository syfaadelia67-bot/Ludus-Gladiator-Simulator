name: Temporary Final Closure Fix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: temp-final-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Patch residual runtime issues, format GDScript, commit and self-delete
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          resolver = Path('game/scripts/combat/combat_skill_runtime_resolver.gd')
          text = resolver.read_text(encoding='utf-8')
          old = 'var mapped_action_id := str(mapping.get("base_action_id", ""))'
          new = 'var mapped_action_id := str(mapping.get("base_action", ""))'
          if old not in text:
              raise SystemExit('skill resolver base_action_id anchor not found')
          resolver.write_text(text.replace(old, new, 1), encoding='utf-8')

          readiness = Path('game/scripts/core/demo_pre_asset_readiness.gd')
          text = readiness.read_text(encoding='utf-8')
          next_functions = [
              '_append_monthly_event_blocker',
              '_append_monthly_rival_blocker',
              '_append_non_gt_loop_blocker',
              '_append_authority_boundary_blockers',
          ]
          for next_function in next_functions:
              old = f'''\t\t\t\tfalse\n\t\t\t)\n\n\nfunc {next_function}'''
              new = f'''\t\t\t\tfalse\n\t\t\t)\n\t\t)\n\n\nfunc {next_function}'''
              if old not in text:
                  raise SystemExit(f'readiness closing anchor not found before {next_function}')
              text = text.replace(old, new, 1)
          readiness.write_text(text, encoding='utf-8')
          PY

          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check --no-input 'gdtoolkit==4.5.0'
          git diff --name-only -z --diff-filter=ACMR "$PR_BASE_SHA" HEAD -- '*.gd' > changed-gdscript.bin
          mapfile -d '' FILES < changed-gdscript.bin
          .ci-venv/bin/gdformat "${FILES[@]}"

          rm .github/workflows/temp-final-closure-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.gd' .github/workflows/temp-final-closure-fix.yml
          git commit -m 'Close final pre-asset programming regressions'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
