name: Part 4 Combat Contract Autofmt Once

on:
  push:
    branches:
      - feature/monthly-campaign-foundation
    paths:
      - game/tests/combat_contract_foundation_test.gd
      - .github/workflows/part4-combat-contract-autofmt-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/monthly-campaign-foundation
          persist-credentials: true

      - name: Install pinned gdtoolkit
        run: python3 -m pip install --disable-pip-version-check --no-input 'gdtoolkit==4.5.0'

      - name: Format combat contract test
        run: gdformat game/tests/combat_contract_foundation_test.gd

      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- game/tests/combat_contract_foundation_test.gd; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/tests/combat_contract_foundation_test.gd
          git commit -m "style(combat): apply canonical foundation test format"
          git push origin HEAD:feature/monthly-campaign-foundation
