name: Temporary Audit Finance Only

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: temp-audit-finance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fail-close legacy sponsor and loan paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          economy = Path('game/scripts/systems/economy_manager.gd')
          text = economy.read_text(encoding='utf-8')
          text = text.replace(
              'data["eligible"] = GameState.reputation >= int(data.get("required_reputation", 999))\n\tdata["monthly_authority"] = false',
              'data["eligible"] = false\n\tdata["monthly_authority"] = false\n\tdata["demo_available"] = false\n\tdata["availability_reason"] = "Balance mensual de patrocinadores pendiente; alta deshabilitada en la demo."',
              1,
          )
          text = text.replace(
              'data["id"] = loan_id\n\tdata["monthly_authority"] = false\n\treturn data',
              'data["id"] = loan_id\n\tdata["monthly_authority"] = false\n\tdata["demo_available"] = false\n\tdata["availability_reason"] = "Balance mensual de préstamos pendiente; alta deshabilitada en la demo."\n\treturn data',
              1,
          )
          a = text.index('func sign_contract(sponsor_id: String) -> bool:')
          b = text.index('\n\nfunc take_loan(', a)
          text = text[:a] + '''func sign_contract(sponsor_id: String) -> bool:\n\tif not SPONSORS.has(sponsor_id):\n\t\tcontract_failed.emit("El patrocinador seleccionado no existe.")\n\t\treturn false\n\tcontract_failed.emit(\n\t\t"Patrocinadores no están habilitados en la demo mensual hasta congelar su balance."\n\t)\n\treturn false\n''' + text[b:]
          a = text.index('func take_loan(loan_id: String) -> bool:')
          b = text.index('\n\nfunc get_monthly_population_snapshot()', a)
          text = text[:a] + '''func take_loan(loan_id: String) -> bool:\n\tif not LOAN_PRODUCTS.has(loan_id):\n\t\tloan_failed.emit("El préstamo seleccionado no existe.")\n\t\treturn false\n\tloan_failed.emit(\n\t\t"Préstamos no están habilitados en la demo mensual hasta congelar su balance."\n\t)\n\treturn false\n\n\nfunc get_finance_scope_contract() -> Dictionary:\n\treturn {\n\t\t"status": "frozen",\n\t\t"scope": "demo_monthly_finance_boundary",\n\t\t"sponsor_contract_creation_enabled": false,\n\t\t"loan_origination_enabled": false,\n\t\t"legacy_finance_state_read_only": true,\n\t\t"sponsor_monthly_balance_status": "pending_design",\n\t\t"loan_monthly_balance_status": "pending_design",\n\t\t"bankruptcy_monthly_balance_status": "pending_design",\n\t\t"invent_missing_balance_allowed": false,\n\t\t"save_version_change_required": false,\n\t}\n''' + text[b:]
          economy.write_text(text, encoding='utf-8')

          panel = Path('game/scripts/ui/economy_panel.gd')
          text = panel.read_text(encoding='utf-8')
          text = text.replace('\t_populate_options()\n\t_refresh()\n', '\t_populate_options()\n\t_apply_demo_finance_boundary()\n\t_refresh()\n', 1)
          text = text.replace(
              '"%s — Rep. %d" % [data.get("name", sponsor_id), int(data.get("required_reputation", 0))]',
              '"[LEGADO] %s — no disponible en demo" % data.get("name", sponsor_id)',
              1,
          )
          text = text.replace(
              '"%s — %d denarios" % [data.get("name", loan_id), int(data.get("principal", 0))]',
              '"[LEGADO] %s — no disponible en demo" % data.get("name", loan_id)',
              1,
          )
          anchor = '\n\nfunc _on_sign_contract() -> void:'
          boundary = '''\n\nfunc _apply_demo_finance_boundary() -> void:\n\tvar contract := EconomyManager.get_finance_scope_contract()\n\tvar message := (\n\t\t"Patrocinadores y préstamos están preservados para Save v14, pero no pueden contratarse "\n\t\t+ "en la demo hasta congelar su balance mensual."\n\t)\n\tsponsor_selector.disabled = true\n\tloan_selector.disabled = true\n\tsign_button.disabled = true\n\tloan_button.disabled = true\n\tsponsor_selector.tooltip_text = message\n\tloan_selector.tooltip_text = message\n\tsign_button.tooltip_text = message\n\tloan_button.tooltip_text = message\n\tstatus.text = message if bool(contract.get("legacy_finance_state_read_only", false)) else ""\n'''
          if 'func _apply_demo_finance_boundary()' not in text:
              text = text.replace(anchor, boundary + anchor, 1)
          a = text.index('func _on_sign_contract() -> void:')
          b = text.index('\n\nfunc _on_selection_changed', a)
          text = text[:a] + '''func _on_sign_contract() -> void:\n\t_show_error("Patrocinadores no están habilitados en la demo mensual.")\n\n\nfunc _on_take_loan() -> void:\n\t_show_error("Préstamos no están habilitados en la demo mensual.")\n''' + text[b:]
          old_refresh = '''\tif sponsor_selector.selected >= 0 and sponsor_selector.selected < sponsor_ids.size():\n\t\tvar sponsor := EconomyManager.get_sponsor(sponsor_ids[sponsor_selector.selected])\n\t\tsign_button.disabled = not bool(sponsor.get("eligible", false))\n\t\tsign_button.tooltip_text = (\n\t\t\t"Anticipo %d | Ingreso mensual %d | Duración %d meses"\n\t\t\t% [\n\t\t\t\tint(sponsor.get("upfront", 0)),\n\t\t\t\tint(sponsor.get("monthly_income", sponsor.get("weekly_income", 0))),\n\t\t\t\tint(sponsor.get("duration_months", sponsor.get("duration_weeks", 0))),\n\t\t\t]\n\t\t)\n'''
          text = text.replace(old_refresh, '\t_apply_demo_finance_boundary()\n', 1)
          panel.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/temp-audit-finance-only.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/scripts/systems/economy_manager.gd game/scripts/ui/economy_panel.gd .github/workflows/temp-audit-finance-only.yml
          git commit -m 'Audit: fail-close unfrozen sponsor and loan actions'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
