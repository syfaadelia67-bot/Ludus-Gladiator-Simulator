name: One-time hosted UI contract migration

on:
  push:
    branches:
      - feature/demo-data-foundation
    paths:
      - .github/workflows/one-time-ui-contract-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v6
        with:
          ref: feature/demo-data-foundation
          fetch-depth: 0

      - name: Align hosted UI implementation and contracts
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          def write(path: str, content: str) -> None:
              Path(path).write_text(dedent(content).lstrip(), encoding="utf-8", newline="\n")

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(old, new, 1)

          def replace_between(source: str, start_marker: str, end_marker: str, replacement: str, label: str) -> str:
              start = source.find(start_marker)
              end = source.find(end_marker, start + len(start_marker))
              if start < 0 or end < 0:
                  raise SystemExit(f"{label}: section markers not found")
              return source[:start] + dedent(replacement).lstrip() + source[end:]

          # The first-gladiator selection must mount on the hosted MarketScreen,
          # not on the hidden legacy Mercado tab retained for compatibility.
          presenter_path = Path("game/scripts/ui/initial_gladiator_selection_presenter.gd")
          presenter = presenter_path.read_text(encoding="utf-8")
          presenter = replace_once(
              presenter,
              "var buy_button: Button\nvar selection_root: VBoxContainer",
              "var buy_button: Button\nvar market_landing: Control\nvar market_content_shell: Control\nvar selection_root: VBoxContainer",
              "initial selection hosted controls",
          )
          presenter = replace_between(
              presenter,
              "func _ready() -> void:\n",
              "func _set_tutorial_occluded(occluded: bool) -> void:\n",
              '''
              func _ready() -> void:
                  process_mode = Node.PROCESS_MODE_ALWAYS
                  MarketManager.market_changed.connect(_refresh)
                  MarketManager.purchase_failed.connect(_show_feedback)
                  UniqueGladiatorManager.unique_gladiators_changed.connect(_refresh)
                  FincaHubController.system_opened.connect(_on_system_opened)
                  call_deferred("_bind")

              func _on_system_opened(system_id: String) -> void:
                  if system_id == "mercado":
                      call_deferred("_bind")

              func _bind() -> void:
                  var hosted_market := FincaHubController.get_hosted_screen("mercado") as VBoxContainer
                  if hosted_market == null:
                      return
                  market_panel = hosted_market
                  market_landing = hosted_market.get_node_or_null("Landing") as Control
                  market_content_shell = hosted_market.get_node_or_null("ContentShell") as Control
                  market_list = hosted_market.get_node_or_null("ContentShell/FightersView/OffersPanel/Margin/Content/List") as ItemList
                  market_details = hosted_market.get_node_or_null("ContentShell/FightersView/DetailsPanel/Margin/Scroll/Content/Details") as RichTextLabel
                  buy_button = hosted_market.get_node_or_null("ContentShell/FightersView/DetailsPanel/Margin/Scroll/Content/Buy") as Button
                  _ensure_selection_root()
                  _refresh()

              func _ensure_selection_root() -> void:
                  selection_root = market_panel.get_node_or_null(ROOT_NAME) as VBoxContainer
                  if selection_root != null:
                      return
                  selection_root = VBoxContainer.new()
                  selection_root.name = ROOT_NAME
                  selection_root.size_flags_horizontal = Control.SIZE_EXPAND_FILL
                  selection_root.size_flags_vertical = Control.SIZE_EXPAND_FILL
                  selection_root.add_theme_constant_override("separation", 8)
                  market_panel.add_child(selection_root)
                  market_panel.move_child(selection_root, mini(1, market_panel.get_child_count() - 1))

              func _refresh() -> void:
                  if market_panel == null or not is_instance_valid(market_panel):
                      _bind()
                      return
                  var choosing_first: bool = not UniqueGladiatorManager.first_purchase_completed and not RosterManager.has_gladiator()
                  selection_root.visible = choosing_first
                  _set_tutorial_occluded(choosing_first)
                  if market_landing != null:
                      market_landing.visible = not choosing_first
                      market_landing.mouse_filter = Control.MOUSE_FILTER_PASS if not choosing_first else Control.MOUSE_FILTER_IGNORE
                  if market_content_shell != null:
                      market_content_shell.visible = not choosing_first
                      market_content_shell.mouse_filter = Control.MOUSE_FILTER_PASS if not choosing_first else Control.MOUSE_FILTER_IGNORE
                  if market_list != null:
                      market_list.visible = not choosing_first
                  if market_details != null:
                      market_details.visible = not choosing_first
                  if buy_button != null:
                      buy_button.visible = not choosing_first
                  if choosing_first:
                      _render_candidates()

              ''',
              "initial selection hosted binding",
          )
          presenter_path.write_text(presenter, encoding="utf-8", newline="\n")

          # Tutorial routes the player to the hosted Barracks screen.
          tutorial_path = Path("game/scripts/ui/tutorial_controller.gd")
          tutorial = tutorial_path.read_text(encoding="utf-8")
          tutorial = replace_once(tutorial, '"system":"personal"', '"system":"barracks"', "tutorial system id")
          tutorial = replace_once(tutorial, 'system_id == "personal"', 'system_id == "barracks"', "tutorial completion route")
          tutorial = replace_once(tutorial, 'FincaHubController.open_system("personal")', 'FincaHubController.open_system("barracks")', "tutorial action route")
          tutorial_path.write_text(tutorial, encoding="utf-8", newline="\n")

          # Remove presentation autoloads that still search the obsolete tab tree.
          project_path = Path("game/project.godot")
          project = project_path.read_text(encoding="utf-8")
          for obsolete_line in [
              'FincaBuildingNavigationController="*res://scripts/ui/finca_building_navigation_controller.gd"\n',
              'FincaReturnNavigationController="*res://scripts/ui/finca_return_navigation_controller.gd"\n',
          ]:
              project = replace_once(project, obsolete_line, "", f"remove {obsolete_line.split('=')[0]}")
          project_path.write_text(project, encoding="utf-8", newline="\n")

          wrapper_path = Path("game/tools/ludus_gut_cmdln.gd")
          wrapper = wrapper_path.read_text(encoding="utf-8")
          wrapper = wrapper.replace('    "FincaBuildingNavigationController",\n', '')
          wrapper = wrapper.replace('    "FincaReturnNavigationController",\n', '')
          wrapper_path.write_text(wrapper, encoding="utf-8", newline="\n")

          write("game/tests/arena_opponent_preview_test.gd", '''
              extends Node

              func run() -> void:
                  var combat := FileAccess.get_file_as_string("res://scripts/systems/combat_manager_weekly.gd")
                  var arena := FileAccess.get_file_as_string("res://scripts/ui/arena_screen.gd")
                  var scene := FileAccess.get_file_as_string("res://scenes/ArenaScreen.tscn")

                  assert(combat.contains("func get_current_opponent_preview"))
                  assert(combat.contains("RivalUniqueGladiatorController.get_opponent_for_week"))
                  assert(combat.contains("Bestia no revelada"))
                  assert(combat.contains("GladiatorRivalryController.get_rivalry"))
                  assert(arena.contains("func _refresh_encounter()"))
                  assert(arena.contains("CombatManager.get_current_opponent_preview(selected_fighter_id)"))
                  assert(arena.contains("GladiatorRivalryController.rivalry_changed.connect"))
                  assert(arena.contains("Marcador personal"))
                  assert(arena.contains("Vida estimada"))
                  assert(scene.contains("name=\"OpponentInfo\"") or scene.contains("name = \"OpponentInfo\""))
                  print("Arena hosted opponent preview contract: OK")
          ''')

          write("game/tests/initial_gladiator_selection_presenter_test.gd", '''
