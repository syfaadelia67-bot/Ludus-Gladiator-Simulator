                  assert(project.contains("WeeklyEventModalPresenter="))
                  print("Weekly event modal and hosted Arena exit contract: OK")
          ''')

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-ui-contract-migration.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game .github/workflows/one-time-ui-contract-migration.yml
          git commit -m "Align UI contracts with hosted screens"
          git push origin HEAD:feature/demo-data-foundation
