name: Temporary Audit UI Finance Fix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: temp-audit-ui-finance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply audited UI and finance boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing anchor in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          arena = 'game/scripts/ui/arena_screen.gd'
          replace_once(
              arena,
              '''\tvar action_id := _selected_action_id()\n\tvar targets_by_actor: Dictionary = {}\n\tif _arena_runtime.action_requires_target(action_id):\n\t\tvar target_id := _selected_target_id()\n\t\tif target_id.is_empty():\n\t\t\treturn _ui_rejected(\n\t\t\t\t"target_required", ["La acción seleccionada requiere un objetivo explícito."]\n\t\t\t)\n\t\tfor actor_id in _arena_runtime.get_active_player_ids(_session):\n\t\t\ttargets_by_actor[actor_id] = target_id\n''',
              '''\tvar option_id := _selected_action_id()\n\tvar targets_by_actor: Dictionary = {}\n\tif _arena_runtime.option_requires_manual_target(_session, option_id):\n\t\tvar target_id := _selected_target_id()\n\t\tif target_id.is_empty():\n\t\t\treturn _ui_rejected(\n\t\t\t\t"target_required", ["La opción seleccionada requiere un objetivo enemigo explícito."]\n\t\t\t)\n\t\tfor actor_id in _arena_runtime.get_active_player_ids(_session):\n\t\t\ttargets_by_actor[actor_id] = target_id\n'''
          )
          replace_once(arena, '\t\t\taction_id,\n\t\t\ttargets_by_actor,\n', '\t\t\toption_id,\n\t\t\ttargets_by_actor,\n')
          replace_once(
              arena,
              '''\t\t"ai_requests_are_external": true,\n\t\t"save_version_change_required": false,\n''',
              '''\t\t"ai_requests_are_external": true,\n\t\t"canonical_skill_options_exposed": true,\n\t\t"canonical_skill_runtime_rank": 1,\n\t\t"higher_skill_ranks_exposed": false,\n\t\t"save_version_change_required": false,\n'''
          )
          old_populate = '''func _populate_actions() -> void:\n\taction_selector.clear()\n\t_action_ids.clear()\n\tfor contract in _arena_runtime.get_action_contracts():\n\t\tvar action_id := str(contract.get("id", ""))\n\t\tif action_id.is_empty():\n\t\t\tcontinue\n\t\t_action_ids.append(action_id)\n\t\taction_selector.add_item(str(ACTION_LABELS.get(action_id, action_id)))\n\tif not _action_ids.is_empty():\n\t\taction_selector.select(0)\n'''
          new_populate = '''func _populate_actions() -> void:\n\tvar previous_id := _selected_action_id()\n\taction_selector.clear()\n\t_action_ids.clear()\n\tfor raw_contract in _arena_runtime.get_player_option_contracts(_session):\n\t\tvar contract := raw_contract as Dictionary\n\t\tvar option_id := str(contract.get("id", ""))\n\t\tif option_id.is_empty():\n\t\t\tcontinue\n\t\t_action_ids.append(option_id)\n\t\tvar is_skill := str(contract.get("option_type", "action")) == "skill"\n\t\tvar label := str(contract.get("name", ACTION_LABELS.get(option_id, option_id)))\n\t\tif is_skill:\n\t\t\tlabel = "Skill · %s · R1" % label\n\t\taction_selector.add_item(label)\n\t\tvar index := action_selector.item_count - 1\n\t\taction_selector.set_item_disabled(index, not bool(contract.get("available", true)))\n\t\taction_selector.set_item_tooltip(index, str(contract.get("unavailable_reason", "")))\n\tif _action_ids.is_empty():\n\t\treturn\n\tvar selected_index := _action_ids.find(previous_id)\n\tif selected_index < 0 or action_selector.is_item_disabled(selected_index):\n\t\tselected_index = 0\n\t\twhile selected_index < _action_ids.size() and action_selector.is_item_disabled(selected_index):\n\t\t\tselected_index += 1\n\tif selected_index >= _action_ids.size():\n\t\tselected_index = 0\n\taction_selector.select(selected_index)\n'''
          replace_once(arena, old_populate, new_populate)
          replace_once(
              arena,
              '''func _refresh_all() -> void:\n\t_refresh_event()\n\t_refresh_roster()\n\t_refresh_snapshot()\n\t_refresh_encounter_panel()\n\t_refresh_combat_controls()\n''',
              '''func _refresh_all() -> void:\n\t_refresh_event()\n\t_refresh_roster()\n\t_refresh_snapshot()\n\t_refresh_encounter_panel()\n\t_populate_actions()\n\t_refresh_combat_controls()\n'''
          )
          replace_once(
              arena,
              '''\t\t\t+ "La actividad de Arena fuera de XIII, XVI y XX sigue pendiente de definición."\n''',
              '''\t\t\t+ "En la demo, los meses fuera de XIII, XVI y XX son de gestión; la Arena no-GT queda diferida al juego completo."\n'''
          )
          start = Path(arena).read_text(encoding='utf-8')
          a = start.index('func _refresh_combat_controls() -> void:')
          b = start.index('\n\nfunc _selected_action_id()', a)
          replacement = '''func _refresh_combat_controls() -> void:\n\tvar option_id := _selected_action_id()\n\tvar option := _arena_runtime.get_player_option_contract(_session, option_id)\n\tvar manual_target_required := _arena_runtime.option_requires_manual_target(_session, option_id)\n\t_refresh_targets(manual_target_required)\n\ttarget_selector.visible = manual_target_required\n\tvar session_running := str(_session.get("status", "")) == "combat_running"\n\tvar provider_ready := _ai_request_provider.is_valid()\n\tvar option_ready := not option.is_empty() and bool(option.get("available", true))\n\tvar target_ready := not manual_target_required or not _selected_target_id().is_empty()\n\tstart_button.disabled = not session_running or not provider_ready or not option_ready or not target_ready\n\n\tvar is_skill := str(option.get("option_type", "action")) == "skill"\n\tvar label := str(option.get("name", ACTION_LABELS.get(option_id, option_id)))\n\tvar target_text := "enemigo explícito" if manual_target_required else "automático / no requerido"\n\tvar type_text := "SKILL R1" if is_skill else "ACCIÓN BASE"\n\tplan_summary.text = (\n\t\t"[b]%s COMBAT V1[/b]\\n%s · Stamina %d\\nObjetivo: %s\\n%s"\n\t\t% [\n\t\t\ttype_text,\n\t\t\tlabel,\n\t\t\tint(option.get("stamina_cost", 0)),\n\t\t\ttarget_text,\n\t\t\tstr(option.get("unavailable_reason", "La opción se valida por contrato antes del simulador.")),\n\t\t]\n\t)\n\n\tif not session_running:\n\t\tstart_button.text = "ESPERANDO SERIE GT I"\n\telif not provider_ready:\n\t\tstart_button.text = "ESPERANDO POLÍTICA LIMBOAI"\n\telif not option_ready:\n\t\tstart_button.text = "OPCIÓN NO DISPONIBLE"\n\telif not target_ready:\n\t\tstart_button.text = "SELECCIONÁ OBJETIVO"\n\telse:\n\t\tstart_button.text = "RESOLVER INTERCAMBIO"\n\n\nfunc _refresh_targets(manual_target_required: bool = false) -> void:\n\tvar previous := _selected_target_id()\n\ttarget_selector.clear()\n\t_target_ids.clear()\n\tif not manual_target_required:\n\t\treturn\n\t_target_ids = _arena_runtime.get_active_enemy_ids(_session)\n\tfor target_id in _target_ids:\n\t\ttarget_selector.add_item(target_id)\n\tif _target_ids.is_empty():\n\t\treturn\n\tvar index := _target_ids.find(previous)\n\tif index < 0:\n\t\tindex = 0\n\ttarget_selector.select(index)\n'''
          Path(arena).write_text(start[:a] + replacement + start[b:], encoding='utf-8')

          economy = 'game/scripts/systems/economy_manager.gd'
          replace_once(
              economy,
              '''\tdata["eligible"] = GameState.reputation >= int(data.get("required_reputation", 999))\n\tdata["monthly_authority"] = false\n''',
              '''\tdata["eligible"] = false\n\tdata["monthly_authority"] = false\n\tdata["demo_available"] = false\n\tdata["availability_reason"] = "Balance mensual de patrocinadores pendiente; alta deshabilitada en la demo."\n'''
          )
          replace_once(
              economy,
              '''\tdata["id"] = loan_id\n\tdata["monthly_authority"] = false\n\treturn data\n''',
              '''\tdata["id"] = loan_id\n\tdata["monthly_authority"] = false\n\tdata["demo_available"] = false\n\tdata["availability_reason"] = "Balance mensual de préstamos pendiente; alta deshabilitada en la demo."\n\treturn data\n'''
          )
          s = Path(economy).read_text(encoding='utf-8')
          a = s.index('func sign_contract(sponsor_id: String) -> bool:')
          b = s.index('\n\nfunc take_loan(', a)
          sign = '''func sign_contract(sponsor_id: String) -> bool:\n\tif not SPONSORS.has(sponsor_id):\n\t\tcontract_failed.emit("El patrocinador seleccionado no existe.")\n\t\treturn false\n\tcontract_failed.emit(\n\t\t"Patrocinadores no están habilitados en la demo mensual hasta congelar su balance."\n\t)\n\treturn false\n'''
          s = s[:a] + sign + s[b:]
          a = s.index('func take_loan(loan_id: String) -> bool:')
          b = s.index('\n\nfunc get_monthly_population_snapshot()', a)
          loan = '''func take_loan(loan_id: String) -> bool:\n\tif not LOAN_PRODUCTS.has(loan_id):\n\t\tloan_failed.emit("El préstamo seleccionado no existe.")\n\t\treturn false\n\tloan_failed.emit(\n\t\t"Préstamos no están habilitados en la demo mensual hasta congelar su balance."\n\t)\n\treturn false\n\n\nfunc get_finance_scope_contract() -> Dictionary:\n\treturn {\n\t\t"status": "frozen",\n\t\t"scope": "demo_monthly_finance_boundary",\n\t\t"sponsor_contract_creation_enabled": false,\n\t\t"loan_origination_enabled": false,\n\t\t"legacy_finance_state_read_only": true,\n\t\t"sponsor_monthly_balance_status": "pending_design",\n\t\t"loan_monthly_balance_status": "pending_design",\n\t\t"bankruptcy_monthly_balance_status": "pending_design",\n\t\t"invent_missing_balance_allowed": false,\n\t\t"save_version_change_required": false,\n\t}\n'''
          Path(economy).write_text(s[:a] + loan + s[b:], encoding='utf-8')

          panel = 'game/scripts/ui/economy_panel.gd'
          replace_once(
              panel,
              '''\t_populate_options()\n\t_refresh()\n''',
              '''\t_populate_options()\n\t_apply_demo_finance_boundary()\n\t_refresh()\n'''
          )
          replace_once(
              panel,
              '''\t\tsponsor_selector.add_item(\n\t\t\t"%s — Rep. %d" % [data.get("name", sponsor_id), int(data.get("required_reputation", 0))]\n\t\t)\n''',
              '''\t\tsponsor_selector.add_item(\n\t\t\t"[LEGADO] %s — no disponible en demo" % data.get("name", sponsor_id)\n\t\t)\n'''
          )
          replace_once(
              panel,
              '''\t\tloan_selector.add_item(\n\t\t\t"%s — %d denarios" % [data.get("name", loan_id), int(data.get("principal", 0))]\n\t\t)\n''',
              '''\t\tloan_selector.add_item(\n\t\t\t"[LEGADO] %s — no disponible en demo" % data.get("name", loan_id)\n\t\t)\n\n\nfunc _apply_demo_finance_boundary() -> void:\n\tvar contract := EconomyManager.get_finance_scope_contract()\n\tvar message := (\n\t\t"Patrocinadores y préstamos están preservados para Save v14, pero no pueden contratarse "\n\t\t+ "en la demo hasta congelar su balance mensual."\n\t)\n\tsponsor_selector.disabled = true\n\tloan_selector.disabled = true\n\tsign_button.disabled = true\n\tloan_button.disabled = true\n\tsponsor_selector.tooltip_text = message\n\tloan_selector.tooltip_text = message\n\tsign_button.tooltip_text = message\n\tloan_button.tooltip_text = message\n\tstatus.text = message if bool(contract.get("legacy_finance_state_read_only", false)) else ""\n'''
          )
          s = Path(panel).read_text(encoding='utf-8')
          a = s.index('func _on_sign_contract() -> void:')
          b = s.index('\n\nfunc _on_selection_changed', a)
          handlers = '''func _on_sign_contract() -> void:\n\t_show_error("Patrocinadores no están habilitados en la demo mensual.")\n\n\nfunc _on_take_loan() -> void:\n\t_show_error("Préstamos no están habilitados en la demo mensual.")\n'''
          s = s[:a] + handlers + s[b:]
          s = s.replace(
              '''\tif sponsor_selector.selected >= 0 and sponsor_selector.selected < sponsor_ids.size():\n\t\tvar sponsor := EconomyManager.get_sponsor(sponsor_ids[sponsor_selector.selected])\n\t\tsign_button.disabled = not bool(sponsor.get("eligible", false))\n\t\tsign_button.tooltip_text = (\n\t\t\t"Anticipo %d | Ingreso mensual %d | Duración %d meses"\n\t\t\t% [\n\t\t\t\tint(sponsor.get("upfront", 0)),\n\t\t\t\tint(sponsor.get("monthly_income", sponsor.get("weekly_income", 0))),\n\t\t\t\tint(sponsor.get("duration_months", sponsor.get("duration_weeks", 0))),\n\t\t\t]\n\t\t)\n''',
              '''\t_apply_demo_finance_boundary()\n''',
              1,
          )
          Path(panel).write_text(s, encoding='utf-8')
          PY

          rm .github/workflows/temp-audit-ui-finance-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/scripts/ui/arena_screen.gd \
                  game/scripts/systems/economy_manager.gd \
                  game/scripts/ui/economy_panel.gd \
                  .github/workflows/temp-audit-ui-finance-fix.yml
          git commit -m 'Audit: expose rank 1 skills and fail-close legacy finance actions'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
