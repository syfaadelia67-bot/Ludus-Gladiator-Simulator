name: One-time dossier parse repair

on:
  push:
    branches:
      - feature/demo-data-foundation
    paths:
      - .github/workflows/one-time-dossier-parse-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v6
        with:
          ref: feature/demo-data-foundation
          fetch-depth: 0

      - name: Repair reserved trait identifiers
        shell: python
        run: |
          from pathlib import Path

          path = Path("game/scripts/ui/gladiator_dossier_panel.gd")
          source = path.read_text(encoding="utf-8")

          first_old = '''        var trait: Dictionary = TraitManager.get_trait(trait_id)
                  var category := str(trait.get("category", "other"))
                  if not categories.has(category):
                      category = "other"
                  categories[category].append({"id":trait_id, "data":trait})'''
          first_new = '''        var trait_data: Dictionary = TraitManager.get_trait(trait_id)
                  var category := str(trait_data.get("category", "other"))
                  if not categories.has(category):
                      category = "other"
                  categories[category].append({"id":trait_id, "data":trait_data})'''

          second_old = '''            var trait: Dictionary = entry.get("data", {})
                      var modifiers: Dictionary = trait.get("modifiers", {})
                      var modifier_lines: Array[String] = []
                      for key in modifiers.keys():
                          modifier_lines.append("%s: %s" % [str(key).replace("_", " ").capitalize(), str(modifiers[key])])
                      _add_card(TraitManager.get_trait_name(trait_id).to_upper(), "%s%s" % [
                          str(trait.get("description", "Rasgo registrado en la historia del gladiador.")),'''
          second_new = '''            var trait_data: Dictionary = entry.get("data", {})
                      var modifiers: Dictionary = trait_data.get("modifiers", {})
                      var modifier_lines: Array[String] = []
                      for key in modifiers.keys():
                          modifier_lines.append("%s: %s" % [str(key).replace("_", " ").capitalize(), str(modifiers[key])])
                      _add_card(TraitManager.get_trait_name(trait_id).to_upper(), "%s%s" % [
                          str(trait_data.get("description", "Rasgo registrado en la historia del gladiador.")),'''

          if source.count(first_old) != 1:
              raise SystemExit("Expected first reserved-trait block exactly once")
          if source.count(second_old) != 1:
              raise SystemExit("Expected second reserved-trait block exactly once")

          source = source.replace(first_old, first_new).replace(second_old, second_new)
          path.write_text(source, encoding="utf-8", newline="\n")

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-dossier-parse-repair.yml

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/scripts/ui/gladiator_dossier_panel.gd .github/workflows/one-time-dossier-parse-repair.yml
          git commit -m "Fix dossier trait parse error"
          git push origin HEAD:feature/demo-data-foundation
