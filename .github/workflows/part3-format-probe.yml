name: Part 3 Format Probe

on:
  push:
    branches:
      - feature/monthly-campaign-foundation

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install gdtoolkit
        run: python3 -m pip install --disable-pip-version-check --no-input 'gdtoolkit==4.5.0'
      - name: Print canonical gdformat diff
        run: |
          gdformat game/scripts/systems/estate_manager.gd game/tests/estate_catalog_test.gd
          git diff -- game/scripts/systems/estate_manager.gd game/tests/estate_catalog_test.gd
