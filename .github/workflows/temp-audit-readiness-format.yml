name: Temporary Audit Readiness Format

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: temp-audit-readiness-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Patch readiness, format changed GDScript, commit and self-delete
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          readiness = Path('game/scripts/core/demo_pre_asset_readiness.gd')
          text = readiness.read_text(encoding='utf-8')
          start = text.find('func _append_monthly_economy_blocker(blockers: Array[Dictionary]) -> void:\n')
          end = text.find('\n\nfunc _append_monthly_market_blocker', start)
          if start < 0 or end < 0:
              raise SystemExit('monthly economy readiness function anchors not found')
          replacement = '''func _append_monthly_economy_blocker(blockers: Array[Dictionary]) -> void:\n\tif not EconomyManager.has_method("get_monthly_runtime_contract"):\n\t\tblockers.append(\n\t\t\t_blocker(\n\t\t\t\t"monthly_economy_runtime",\n\t\t\t\t"architecture",\n\t\t\t\t"EconomyManager does not expose the canonical monthly runtime contract.",\n\t\t\t\tfalse\n\t\t\t)\n\t\t)\n\t\treturn\n\tvar contract: Dictionary = EconomyManager.get_monthly_runtime_contract()\n\tvar ready: bool = (\n\t\tcontract.get("status") == "frozen"\n\t\tand contract.get("authority") == "monthly_economy_runtime"\n\t\tand contract.get("period") == "month"\n\t\tand contract.get("process_frequency") == "exactly_once_per_closed_month"\n\t\tand int(contract.get("fixed_monthly_cost", 0)) == 88\n\t\tand int(contract.get("slave_monthly_cost", 0)) == 5\n\t\tand int(contract.get("gladiator_monthly_cost", 0)) == 20\n\t\tand int(contract.get("beast_monthly_cost", 0)) == 10\n\t\tand contract.get("daily_economy_is_authority") == false\n\t\tand contract.get("legacy_weekly_economy_is_authority") == false\n\t\tand contract.get("invent_unfrozen_values_allowed") == false\n\t\tand contract.get("sponsor_demo_available") == false\n\t\tand contract.get("loan_demo_available") == false\n\t\tand contract.get("bankruptcy_demo_available") == false\n\t\tand contract.get("unfrozen_actions_fail_closed") == true\n\t\tand contract.get("save_version_change_required") == false\n\t)\n\tif not ready:\n\t\tblockers.append(\n\t\t\t_blocker(\n\t\t\t\t"monthly_economy_runtime",\n\t\t\t\t"architecture",\n\t\t\t\t"Canonical monthly operating costs or the fail-closed demo finance boundary are incomplete.",\n\t\t\t\tfalse\n\t\t\t)\n\t\t)\n'''
          readiness.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          test = Path('game/tests/demo_pre_asset_readiness_test.gd')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              '"combat_skill_runtime_resolver_contract"',
              '"real_skill_effects_plus_player_options_contract"',
          )
          text = text.replace(
              '"economy_manager_monthly_runtime_contract"',
              '"monthly_runtime_plus_fail_closed_finance_contract"',
          )
          test.write_text(text, encoding='utf-8')
          PY

          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check --no-input 'gdtoolkit==4.5.0'
          git diff --name-only -z --diff-filter=ACMR "$PR_BASE_SHA" HEAD -- '*.gd' > changed-gdscript.bin
          mapfile -d '' FILES < changed-gdscript.bin
          .ci-venv/bin/gdformat "${FILES[@]}"

          rm .github/workflows/temp-audit-readiness-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.gd' .github/workflows/temp-audit-readiness-format.yml
          git commit -m 'Audit: harden readiness and format skill runtime'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
