name: Repository Hygiene

on:
  push:
    branches:
      - main
      - feature/demo-data-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asset-hygiene:
    name: Asset and large-file hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reject restricted staging paths and oversized regular Git files
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -Eq '^(private_assets|licensed_assets_raw)/'; then
            echo 'Restricted/local-only asset staging files are tracked by Git:'
            git ls-files | grep -E '^(private_assets|licensed_assets_raw)/'
            exit 1
          fi

          MAX_BYTES=$((20 * 1024 * 1024))
          FAILED=0
          while IFS= read -r -d '' path; do
            [ -f "$path" ] || continue
            size=$(stat -c '%s' "$path")
            if [ "$size" -gt "$MAX_BYTES" ]; then
              echo "Regular Git file exceeds 20 MiB: $path ($size bytes)"
              echo 'Move an editable master to source_assets/ (Git LFS) or reduce/externalize the file.'
              FAILED=1
            fi
          done < <(git ls-files -z)

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Verify source_assets are LFS-tracked
        shell: bash
        run: |
          set -euo pipefail
          FOUND=0
          while IFS= read -r -d '' path; do
            FOUND=1
            attr=$(git check-attr filter -- "$path")
            if [[ "$attr" != *': filter: lfs' ]]; then
              echo "source_assets file is not covered by Git LFS: $path"
              echo "$attr"
              exit 1
            fi
          done < <(git ls-files -z 'source_assets/**')

          if [ "$FOUND" -eq 0 ]; then
            echo 'No source_assets files are tracked yet; LFS policy is ready for future masters.'
          fi
