name: Temporary GDScript Format Fix

on:
  push:
    branches:
      - feature/monthly-campaign-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned formatter
        run: python -m pip install "gdtoolkit==4.5.0"

      - name: Format changed GDScript files
        shell: bash
        run: |
          git fetch origin chore/ci-hardening
          mapfile -t gd_files < <(git diff --name-only origin/chore/ci-hardening...HEAD -- 'game/**/*.gd')
          if [ ${#gd_files[@]} -eq 0 ]; then
            echo "No changed GDScript files."
            exit 0
          fi
          gdformat "${gd_files[@]}"
          if git diff --quiet -- "${gd_files[@]}"; then
            echo "All changed GDScript files were already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${gd_files[@]}"
          git commit -m "Apply gdformat 4.5.0 to changed GDScript"
          git push origin HEAD:feature/monthly-campaign-foundation
