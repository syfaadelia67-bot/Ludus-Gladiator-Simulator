name: Part 3 Autofmt Once

on:
  push:
    branches:
      - feature/monthly-campaign-foundation
    paths:
      - .github/workflows/part3-autofmt-once.yml

permissions:
  contents: write

jobs:
  gdformat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/monthly-campaign-foundation
          fetch-depth: 0
      - name: Install canonical gdtoolkit
        run: python3 -m pip install --disable-pip-version-check --no-input 'gdtoolkit==4.5.0'
      - name: Format only Part 3 touched GDScript
        run: |
          gdformat \
            game/scripts/core/data_repository.gd \
            game/scripts/core/frozen_data_validator.gd \
            game/scripts/systems/estate_manager.gd \
            game/scripts/systems/market_manager.gd \
            game/scripts/systems/trait_manager.gd \
            game/scripts/ui/finca_hub_controller.gd \
            game/scripts/ui/finca_screen.gd \
            game/tests/data_repository_test.gd \
            game/tests/demo_preflight_consistency_test.gd \
            game/tests/demo_readiness_integration_test.gd \
            game/tests/estate_catalog_test.gd \
            game/tests/frozen_data_contract_test.gd \
            game/tests/test_finca_building_context_access_contract.gd \
            game/tests/test_finca_building_navigation_contract.gd \
            game/tests/test_finca_demo_hub_modal_contract.gd \
            game/tests/test_finca_main_screen_contract.gd \
            game/tests/test_trait_catalog_and_awards.gd
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            game/scripts/core/data_repository.gd \
            game/scripts/core/frozen_data_validator.gd \
            game/scripts/systems/estate_manager.gd \
            game/scripts/systems/market_manager.gd \
            game/scripts/systems/trait_manager.gd \
            game/scripts/ui/finca_hub_controller.gd \
            game/scripts/ui/finca_screen.gd \
            game/tests/data_repository_test.gd \
            game/tests/demo_preflight_consistency_test.gd \
            game/tests/demo_readiness_integration_test.gd \
            game/tests/estate_catalog_test.gd \
            game/tests/frozen_data_contract_test.gd \
            game/tests/test_finca_building_context_access_contract.gd \
            game/tests/test_finca_building_navigation_contract.gd \
            game/tests/test_finca_demo_hub_modal_contract.gd \
            game/tests/test_finca_main_screen_contract.gd \
            game/tests/test_trait_catalog_and_awards.gd
          git commit -m 'style: apply canonical gdformat to Part 3 files'
          git push origin HEAD:feature/monthly-campaign-foundation
