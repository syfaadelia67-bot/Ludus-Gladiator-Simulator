name: Temporary Economy Lint Position Fix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: temp-economy-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Move class-scope lint directive before extends and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('game/scripts/systems/economy_manager.gd')
          text = path.read_text(encoding='utf-8')
          old = (
              'extends Node\n\n'
              '# Compatibility facade: public Save/UI methods stay stable while new logic lives in focused runtimes.\n'
              '# gdlint: disable=max-public-methods\n\n'
          )
          new = (
              '# Compatibility facade: Save/UI public methods stay stable.\n'
              '# New economy logic belongs in focused runtimes.\n'
              '# gdlint: disable=max-public-methods\n'
              'extends Node\n\n'
          )
          if old not in text:
              raise SystemExit('expected EconomyManager lint header not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/temp-economy-lint-position.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/scripts/systems/economy_manager.gd \
                  .github/workflows/temp-economy-lint-position.yml
          git commit -m 'Fix EconomyManager class-scope lint directive'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
