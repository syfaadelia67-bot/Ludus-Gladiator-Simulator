name: Actions Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Runner without external actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner execution
        shell: bash
        run: |
          echo "GitHub Actions runner started successfully."
          echo "No external actions were downloaded."
          uname -a
