name: Part 3 Equipment Canonicalize Once

on:
  push:
    branches:
      - feature/monthly-campaign-foundation
    paths:
      - .github/workflows/part3-equipment-canonicalize-once.yml

permissions:
  contents: write

jobs:
  migrate-equipment-manager:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/monthly-campaign-foundation
          fetch-depth: 0
      - name: Replace hardcoded recipes with DataRepository-backed cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('game/scripts/systems/equipment_manager.gd')
          text = path.read_text(encoding='utf-8')

          legacy_start = 'const RECIPES := {'
          canonical_decl = 'var RECIPES: Dictionary = {}'
          if legacy_start in text:
              start = text.index(legacy_start)
              end = text.index('const UNIVERSAL_TECHNIQUES', start)
              text = text[:start] + canonical_decl + '\n\n' + text[end:]
          elif canonical_decl not in text:
              raise SystemExit('Equipment manager has neither legacy nor canonical recipe declaration')

          if 'func _ensure_recipes_loaded() -> void:' not in text:
              marker = 'var serial: int = 0\n'
              if marker not in text:
                  raise SystemExit('Could not locate equipment inventory declaration marker')
              helper = '''var serial: int = 0\n\nfunc _ready() -> void:\n    _ensure_recipes_loaded()\n\nfunc _ensure_recipes_loaded() -> void:\n    if not RECIPES.is_empty():\n        return\n    for raw_entry in DataRepository.weapons:\n        if not raw_entry is Dictionary:\n            continue\n        var entry: Dictionary = raw_entry\n        var recipe_id := str(entry.get("id", ""))\n        if recipe_id.is_empty() or RECIPES.has(recipe_id):\n            continue\n        var recipe := entry.duplicate(true)\n        recipe.erase("id")\n        RECIPES[recipe_id] = recipe\n'''
              text = text.replace(marker, helper, 1)

          get_ids_pattern = re.compile(
              r'func get_recipe_ids\(\) -> Array\[String\]:\n.*?(?=\nfunc get_recipe\()',
              re.S,
          )
          get_ids_replacement = '''func get_recipe_ids() -> Array[String]:\n    _ensure_recipes_loaded()\n    var result: Array[String] = []\n    for recipe_id in RECIPES.keys():\n        result.append(str(recipe_id))\n    result.sort()\n    return result\n'''
          text, count = get_ids_pattern.subn(get_ids_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not normalize get_recipe_ids')

          if 'func get_recipe(recipe_id: String) -> Dictionary:\n    _ensure_recipes_loaded()' not in text:
              text = text.replace(
                  'func get_recipe(recipe_id: String) -> Dictionary:\n',
                  'func get_recipe(recipe_id: String) -> Dictionary:\n    _ensure_recipes_loaded()\n',
                  1,
              )

          if 'func craft(recipe_id: String) -> bool:\n    _ensure_recipes_loaded()' not in text:
              text = text.replace(
                  'func craft(recipe_id: String) -> bool:\n',
                  'func craft(recipe_id: String) -> bool:\n    _ensure_recipes_loaded()\n',
                  1,
              )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply canonical format
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'gdtoolkit==4.5.0'
          gdformat \
            game/scripts/systems/equipment_manager.gd \
            game/tests/equipment_catalog_contract_test.gd
      - name: Commit canonical equipment catalog migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            game/scripts/systems/equipment_manager.gd \
            game/tests/equipment_catalog_contract_test.gd
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(equipment): source forge recipes from canonical JSON'
          git push origin HEAD:feature/monthly-campaign-foundation
